# P2-04 single-process module coexistence. File-only; no audio devices.
audio:
  source: file-input
  sink: file-output
  profile: file-only
  sample_rate: 16000
  channels: 1
  frame_ms: 20
models:
  vad: {enabled: true, id: silero-vad-v5.0}
  asr: {enabled: true, id: zipformer-bilingual-zh-en-rk3588-fp16}
  llm: {enabled: true, id: qwen3.5-2b-rk3588-w8a8}
  tts: {enabled: true, id: vits-melo-tts-zh-en-fp32}
  kws: {enabled: false, id: ""}
assets:
  models_manifest: ../models/manifest.json
  deps_manifest: ../deps/manifest.json
threads:
  vad: 1
  asr: 1
  llm: 1
  tts: 4
llm:
  max_output_tokens: 64
